name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Mondays, 06:23 UTC. Off the hour, and offset from scorecard.yml so the
    # two weekly runs do not queue against each other.
    - cron: '23 6 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    permissions:
      # Uploading results to the code scanning dashboard.
      security-events: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # No build step: javascript-typescript is an interpreted-language
      # extractor, so CodeQL reads the sources directly. That covers all of
      # src/ — the whole published package is TypeScript — plus test/ and the
      # demos' .mjs config and server. It does not parse .astro, so the demo
      # pages are not covered; nothing that ships is written in .astro.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:javascript-typescript"
